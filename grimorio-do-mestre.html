<template id="fichasTpl">
<style>
/* Layout: a campaign archive. Sticky top bar, then one view at a time (campaigns, a campaign's party, one sheet). Each RPG system brings its own sheet look. */
:host{
  --bg:#e9e6df; --panel:#fbfaf6; --panel-2:#f1eee6; --fg:#1e1c19; --muted:#686256; --line:#d6d0c3;
  --accent:#6e2a24; --accent-fg:#fff; --accent-soft:#f0dcd6; --ok:#2f6b3f; --bad:#a3302a;
  --f-ui:"Alegreya Sans",ui-sans-serif,system-ui,sans-serif; --f-title:"IM Fell English SC",Georgia,serif;
  --shadow:0 8px 26px rgba(30,20,10,.16);
}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])){--bg:#121110;--panel:#1b1a18;--panel-2:#24221f;--fg:#ece7dc;--muted:#a49c8d;--line:#35322d;--accent:#d98b7c;--accent-fg:#1a0d0b;--accent-soft:#3a2420;--ok:#7cc48c;--bad:#ef8a7f;--shadow:0 8px 26px rgba(0,0,0,.5);color-scheme:dark}}
:host([data-theme="dark"]){--bg:#121110;--panel:#1b1a18;--panel-2:#24221f;--fg:#ece7dc;--muted:#a49c8d;--line:#35322d;--accent:#d98b7c;--accent-fg:#1a0d0b;--accent-soft:#3a2420;--ok:#7cc48c;--bad:#ef8a7f;--shadow:0 8px 26px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:host{position:fixed;inset:0;z-index:50;display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;padding-top:calc(9px + env(safe-area-inset-top,0px))!important;z-index:9;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-title);font-size:21px;letter-spacing:.03em;white-space:nowrap;text-decoration:none;color:inherit}
.brand b{color:var(--accent);font-weight:400}
.crumbs{display:flex;gap:6px;align-items:center;min-width:0;flex:1 1 auto;font-size:14px;color:var(--muted)}
.crumbs a{color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.who b{color:var(--fg);font-weight:600}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--bad)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1.view{font-family:var(--f-title);font-weight:400;font-size:32px;margin:4px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:19px;font-family:var(--f-title);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.card .meta{color:var(--muted);font-size:13.5px}
.card a.cover{color:inherit;text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;width:max-content}
.badge.dnd{color:#8e3a1f}.badge.op{color:#b0122f}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])) .badge.dnd{color:#e6a07f}:host(:not([data-theme="light"])) .badge.op{color:#f07087}:host(:not([data-theme="light"])) .badge.etmos{color:#c9a4e0}}
:host([data-theme="dark"]) .badge.dnd{color:#e6a07f}:host([data-theme="dark"]) .badge.op{color:#f07087}:host([data-theme="dark"]) .badge.etmos{color:#c9a4e0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center;background:var(--panel)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px}
.field>span{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.note{color:var(--muted);font-size:13.5px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.5);display:flex;align-items:center;justify-content:center;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(480px,100%);max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:25px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice b{display:block}.choice small{color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:40;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* party cards */
.pc{position:relative;overflow:hidden}
.pc .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 44px;font-size:17px}
.pc .hd{display:flex;gap:10px;align-items:center;min-width:0}
.pc .hd div{min-width:0}
.bar{height:9px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;text-align:center}
.stats div{background:var(--panel-2);border-radius:8px;padding:4px 2px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--fg)}
/* dice tray */
.tray{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tray header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.tray header b{flex:1;font-family:var(--f-title);font-weight:400;font-size:17px}
.tray .body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.tray.closed .body{display:none}
.tray .log{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
.roll{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel-2)}
.roll .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.roll .t span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll .t b{font-size:24px;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",ui-monospace,monospace}
.roll .d{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace}
.roll.crit b{color:var(--ok)}.roll.fail b{color:var(--bad)}
.roll.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.roll.new{animation:none}}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* ============ SHEETS (each system commits to its own look, in both host themes) ============ */
.sheet{border-radius:16px;overflow:hidden;overflow:clip;box-shadow:var(--shadow)}
.sheet fieldset{border:0;margin:0;padding:0;min-width:0}
.sheet input,.sheet select,.sheet textarea{background:transparent;border:0;border-bottom:1px solid var(--sl);border-radius:0;padding:3px 2px;color:var(--sf);width:100%;min-width:0}
.sheet textarea{border:1px solid var(--sl);border-radius:6px;padding:7px 9px;min-height:110px;resize:vertical;line-height:1.45}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:none;border-color:var(--sa);background:var(--sh)}
.sheet input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.sheet input[type=number]::-webkit-inner-spin-button,.sheet input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sheet .btn{background:var(--sp2);border-color:var(--sl);color:var(--sf)}
.sheet .btn:hover{border-color:var(--sa)}
.sheet .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sm);font-weight:600}
.sheet .stabs{display:flex;gap:2px;flex-wrap:wrap;padding:0 18px;border-bottom:1px solid var(--sl);background:var(--sp2)}
.sheet .stabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--sm);font:inherit;font-weight:600}
.sheet .stabs button[aria-selected="true"]{color:var(--sf);border-bottom-color:var(--sa)}
.sheet .sbody{padding:18px}
.sheet .box{border:1px solid var(--sl);border-radius:10px;padding:10px 12px;background:var(--sp);min-width:0}
.sheet .box>h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sa);font-weight:700}
.sheet .tbl{width:100%;border-collapse:collapse}
.sheet .tbl td,.sheet .tbl th{padding:4px 4px;vertical-align:middle;border-bottom:1px solid var(--sl2)}
.sheet .tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sm);text-align:left;font-weight:600}
.sheet .x{background:none;border:0;color:var(--sm);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px}
.sheet .x:hover{color:var(--sa)}
.sheet .add{background:none;border:1px dashed var(--sl);color:var(--sm);border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:8px;font:inherit}
.sheet .add:hover{border-color:var(--sa);color:var(--sf)}
.sheet .rollable{cursor:pointer;border-radius:6px}
.sheet .rollable:hover{background:var(--sh);box-shadow:0 0 0 2px var(--sa) inset}
.sheet .num{font-variant-numeric:tabular-nums}
.sheet .stepper{display:flex;align-items:center;gap:4px}
.sheet .stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--sl);background:var(--sp2);color:var(--sf);cursor:pointer;font-weight:700;flex:0 0 28px}
.sheet .stepper button:hover{border-color:var(--sa)}
.sheet .conds{display:flex;gap:5px;flex-wrap:wrap}
.sheet .conds button{border:1px solid var(--sl);background:transparent;color:var(--sm);border-radius:99px;padding:2px 9px;font-size:13px;cursor:pointer;font:inherit;font-size:13px}
.sheet .conds button[aria-pressed="true"]{background:var(--sa);border-color:var(--sa);color:var(--sab)}
.sheet .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px 18px;background:var(--sp2);border-top:1px solid var(--sl)}
.sheet .tools .btn{background:var(--sp)}
.sheet .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sheet .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.sheet .grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.sheet .grid2{grid-template-columns:minmax(0,1fr)}.sheet .sbody{padding:12px}.sheet .stabs{padding:0 8px}}
.ro-note{font-size:13px;padding:8px 18px;background:var(--sp2);color:var(--sm);border-bottom:1px solid var(--sl)}

/* ---- D&D 5e: illuminated parchment ---- */
.sheet.dnd{--sbg:#efe3c6;--sp:#f6ecd5;--sp2:#e7d7b3;--sf:#2a1c12;--sm:#6f5a40;--sa:#7b1e1e;--sab:#fbf3e2;--sl:#c7ae84;--sl2:#dcc8a2;--sh:#fff6e2;--gold:#a8823a;
  background:var(--sbg);color:var(--sf);font-family:"EB Garamond",Georgia,serif;font-size:16px;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,250,235,.7),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(140,100,50,.18),transparent 55%)}
.sheet.dnd .dhead{padding:18px 20px 14px;border-bottom:3px double var(--gold);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:16px;align-items:end}
.sheet.dnd .dname input{font-family:Cinzel,Georgia,serif;font-size:28px;font-weight:700;color:var(--sa);border-bottom:2px solid var(--gold)}
.sheet.dnd .dmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
@media (max-width:820px){.sheet.dnd .dhead{grid-template-columns:minmax(0,1fr)}.sheet.dnd .dmeta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sheet.dnd .box>h4,.sheet.dnd .lbl{font-family:Cinzel,Georgia,serif}
.sheet.dnd .main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:1050px){.sheet.dnd .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sheet.dnd .main>.c3{grid-column:1/-1}}
@media (max-width:640px){.sheet.dnd .main{grid-template-columns:minmax(0,1fr)}.sheet.dnd .hp{grid-template-columns:minmax(0,1fr)}.crumbs{flex-basis:100%;order:3}}
.sheet.dnd .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet.dnd .atrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet.dnd .atr{text-align:center;border:2px solid var(--gold);border-radius:14px 14px 40% 40%/14px 14px 22% 22%;background:var(--sp);padding:6px 4px 10px;position:relative}
.sheet.dnd .atr .lbl{display:block}
.sheet.dnd .atr .mod{font-family:Cinzel,Georgia,serif;font-size:28px;font-weight:700;color:var(--sa);line-height:1.15;display:block;padding:2px 0}
.sheet.dnd .atr input{width:46px;margin:2px auto 0;text-align:center;border:1px solid var(--gold);border-radius:99px;background:var(--sh);display:block;font-weight:600}
.sheet.dnd .line{display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:15px}
.sheet.dnd .line .v{min-width:30px;text-align:right;font-weight:600}
.sheet.dnd .line .n{flex:1;min-width:0}
.sheet.dnd .line .a{font-size:11px;color:var(--sm);font-family:Cinzel,Georgia,serif}
.sheet.dnd .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--sa);background:transparent;cursor:pointer;flex:0 0 15px;padding:0;position:relative}
.sheet.dnd .dot[data-v="1"]{background:var(--sa)}
.sheet.dnd .dot[data-v="2"]{background:var(--sa);box-shadow:0 0 0 2px var(--sp),0 0 0 3.5px var(--sa)}
.sheet.dnd .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.sheet.dnd .shield{border:2px solid var(--gold);background:var(--sp);padding:8px 4px;border-radius:10px 10px 50% 50%/10px 10px 30% 30%}
.sheet.dnd .shield b,.sheet.dnd .big{font-family:Cinzel,Georgia,serif;font-size:26px;color:var(--sa);display:block;line-height:1.2}
.sheet.dnd .shield input{text-align:center;font-family:Cinzel,Georgia,serif;font-size:24px;font-weight:700;color:var(--sa);border:0}
.sheet.dnd .hp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.sheet.dnd .hpbig{font-family:Cinzel,Georgia,serif;font-size:34px;font-weight:700;color:var(--sa);text-align:center;width:90px}
.sheet.dnd .pips{display:flex;gap:4px;flex-wrap:wrap}
.sheet.dnd .pip{width:16px;height:16px;border:1.5px solid var(--sa);border-radius:4px;background:transparent;cursor:pointer;padding:0}
.sheet.dnd .pip.on{background:var(--sa)}
.sheet.dnd .pip.f{border-radius:50%}
.sheet.dnd .slv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sheet.dnd .lvl-h{font-family:Cinzel,Georgia,serif;color:var(--sa);font-size:15px;margin:12px 0 4px;border-bottom:1px solid var(--sl2)}

/* ---- Ordem Paranormal: classified dossier ---- */
.sheet.op{--sbg:#0f0f12;--sp:#17171c;--sp2:#121216;--sf:#ebe6dd;--sm:#8f8a96;--sa:#d1193f;--sab:#fff;--sl:#2e2d35;--sl2:#232229;--sh:#1f1e25;
  background:var(--sbg);color:var(--sf);font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;font-size:15px;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),radial-gradient(circle at 85% 0%,rgba(209,25,63,.13),transparent 40%)}
.sheet.op .box>h4,.sheet.op .lbl{font-family:"Special Elite",ui-monospace,monospace;letter-spacing:.08em}
.sheet.op .ohead{padding:18px 20px 14px;border-bottom:1px solid var(--sl);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:16px;align-items:end;position:relative}
.sheet.op .ohead::after{content:"CONFIDENCIAL";position:absolute;right:20px;top:12px;font-family:"Special Elite",monospace;color:var(--sa);border:2px solid var(--sa);padding:1px 8px;transform:rotate(-6deg);opacity:.75;font-size:13px;letter-spacing:.15em}
.sheet.op .oname input{font-family:"Special Elite",monospace;font-size:28px;color:var(--sf);border-bottom:2px solid var(--sa)}
.sheet.op .ometa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
@media (max-width:820px){.sheet.op .ohead{grid-template-columns:minmax(0,1fr)}.sheet.op .ometa{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet.op .ohead::after{display:none}}
.sheet.op select option{background:#17171c;color:#ebe6dd}
.sheet.op .stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.sheet.op .stat .nm{font-family:"Special Elite",monospace;font-size:20px}
.sheet.op .meter{height:12px;background:#08080a;border:1px solid var(--sl);border-radius:3px;overflow:hidden;grid-column:1/-1}
.sheet.op .meter i{display:block;height:100%}
.sheet.op .stat .cur{width:58px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:20px}
.sheet.op .stat .mx{font-family:"IBM Plex Mono",monospace;color:var(--sm)}
.sheet.op .ped{position:relative;width:min(300px,100%);aspect-ratio:1/1;margin:0 auto;max-width:100%}
.sheet.op .ped svg{position:absolute;inset:0;width:100%;height:100%}
.sheet.op .patr{position:absolute;transform:translate(-50%,-50%);text-align:center;width:72px}
.sheet.op .patr .ring{width:62px;height:62px;border-radius:50%;border:2px solid var(--sa);background:var(--sp);margin:0 auto;display:grid;place-items:center;box-shadow:0 0 18px rgba(209,25,63,.25)}
.sheet.op .patr input{font-family:"IBM Plex Mono",monospace;font-size:26px;text-align:center;border:0;width:46px;color:var(--sf)}
.sheet.op .patr .lbl{display:block;margin-top:3px}
.sheet.op .grau{display:flex;gap:3px}
.sheet.op .grau button{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid var(--sm);background:transparent;cursor:pointer;padding:0}
.sheet.op .grau button.on{background:var(--sa);border-color:var(--sa)}
.sheet.op .ritual{border:1px solid var(--sl);border-left:5px solid var(--el,#888);border-radius:8px;padding:10px 12px;background:var(--sp);display:grid;gap:8px}

<script id="ponte">
/* Bridge between the map and the sheets: one page, two sections, chosen by the address (#mapa, #mesa-…, #inicio, #campanha-…, #ficha-…). */
(()=>{'use strict';
const FICHAS=/^#(inicio|campanha-|ficha-|entrar-|convite-)/;
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const viewListeners=new Set(),roots=new Set([document]);
let last=null,lastF=ss.get('mesa.lastF')||'#inicio',lastM=ss.get('mesa.lastM')||'#mapa';
const view=()=>FICHAS.test(location.hash)?'fichas':'mapa';
function mark(){const v=view();for(const r of roots)for(const b of r.querySelectorAll('.viewsw [data-go]'))b.setAttribute('aria-pressed',String(b.dataset.go===v));}
function apply(){const v=view(),changed=v!==last;last=v;document.body.dataset.view=v;const h=document.getElementById('fichas');if(h)h.hidden=v!=='fichas';
  if(v==='fichas'){lastF=location.hash;ss.set('mesa.lastF',lastF);}else{lastM=location.hash||'#mapa';ss.set('mesa.lastM',lastM);}
  mark();for(const f of viewListeners)try{f(v,changed);}catch(e){console.error(e);}}
const Mesa=window.Mesa={view,
  go(v,hash){const t=hash||(v==='fichas'?lastF:(Mesa.mapTarget&&Mesa.mapTarget())||(/^#mesa-/.test(lastM)?'#mapa':lastM));if(location.hash===t){apply();return;}location.hash=t;},
  onView(f){viewListeners.add(f);},
  wire(root){roots.add(root);for(const b of root.querySelectorAll('.viewsw [data-go]'))b.onclick=()=>Mesa.go(b.dataset.go);mark();},
  mapTarget:null};
window.addEventListener('hashchange',apply);
/* the sheets sit in a shadow root, so they follow the page theme through an attribute on their host */
const host=document.getElementById('fichas');const syncTheme=()=>{const t=document.documentElement.getAttribute('data-theme');if(t)host.setAttribute('data-theme',t);else host.removeAttribute('data-theme');};
syncTheme();new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
Mesa.wire(document);
queueMicrotask(apply);
})();
</script>

/* derived values */
const dMod=v=>Math.floor((num(v)-10)/2);

const dAtk=s=>dProf(s)+dMod(s.atr[s.conjAtr||'int']);
const dWeight=s=>(s.itens||[]).reduce((a,i)=>a+num(i.qtd||1)*num(i.peso),0);
const dCap=s=>num(s.atr.for)*7.5;
const opLvl=s=>{const n=num(s.nex)||5;return n>=99?20:Math.max(1,Math.round(n/5));};
function opMax(s,k){const c=OP.classes[s.classe]||OP.classes.combatente,L=opLvl(s),vig=num(s.atr.vig),pre=num(s.atr.pre);
  if(k==='pv')return c.pv[0]+vig+(L-1)*(c.pv[1]+vig)+num(s.pvAj);if(k==='pe')return c.pe[0]+pre+(L-1)*(c.pe[1]+pre)+num(s.peAj);return c.san[0]+(L-1)*c.san[1]+num(s.sanAj);}

const opCarga=s=>num(s.atr.for)<=0?2:num(s.atr.for)*5;

const S={mode:'local',uid:'local',master:true,canWrite:null,convites:{},usados:{},logs:{},ready:false,camps:{},pcs:{},npcs:{},notes:{},names:{},readOnlyMsg:''};
let db=null,user=null;const unsub={};const pending=new Map();let saveTimer=null,parentDone=false;
const LOCAL_KEY='grimorio.v1';
function loadLocal(){try{const d=JSON.parse(store.get(LOCAL_KEY)||'{}');S.camps=d.camps||{};S.pcs=d.pcs||{};S.npcs=d.npcs||{};S.notes=d.notes||{};}catch(e){}}
function saveLocal(){store.set(LOCAL_KEY,JSON.stringify({camps:S.camps,pcs:S.pcs,npcs:S.npcs,notes:S.notes}));}
function setStatus(t,err){const el=$('#status');el.textContent=t;el.classList.toggle('err',!!err);}
async function initStore(){
  let d=null,u=null;try{if(window.claude&&window.claude.use)[d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}catch(e){}
  if(d&&u){let id=null;try{id=await u.id();}catch(e){}db=d;user=u;S.mode='cloud';S.uid=id;try{S.master=!!(await u.isOwner());}catch(e){S.master=false;}
    try{S.canWrite=await u.can('data.write');}catch(e){S.canWrite=null;}subscribe();return;}
  S.mode='local';loadLocal();S.ready=true;setStatus('Salvo neste navegador');render();}
function subscribe(){
  setStatus('Carregando…');const to=setTimeout(()=>{if(!S.ready){setStatus('Sem resposta do servidor ainda',true);}},10000);
  const done=()=>{if(!S.ready){S.ready=true;clearTimeout(to);setStatus('Sincronizado');}notify();if(Mesa.view()==='fichas')render();};
  const err=e=>{setStatus(e&&e.code==='revoked'?'Acesso revogado':'Não foi possível sincronizar',true);};
  unsub.c=db.collection('campanhas').onSnapshot(s=>{S.camps={};for(const d of s.docs){const v=d.data();if(v)S.camps[d.id]=Object.assign({id:d.id},v);}done();},err);
  watchPlayer(S.uid);
  if(S.master){unsub.p=db.collection('pjs').onSnapshot(s=>{for(const d of s.docs)watchPlayer(d.id);done();},err);
    unsub.cv=db.collection('convites').onSnapshot(s=>{S.convites={};for(const d of s.docs){const v=d.data();if(v)S.convites[d.id]=Object.assign({id:d.id},v);}done();},err);
    unsub.us=db.collection('usados').onSnapshot(s=>{S.usados={};for(const d of s.docs){const v=d.data();if(v)S.usados[d.id]=v;}done();},err);unsub.n=db.collection('npcs').onSnapshot(s=>{S.npcs={};for(const d of s.docs){const v=d.data();if(v)S.npcs[d.id]=v;}done();},err);
    unsub.s=db.collection('segredos').onSnapshot(s=>{S.notes={};for(const d of s.docs){const v=d.data();if(v)S.notes[d.id]=v;}done();},err);}
}
function watchPlayer(pid){if(!pid||unsub['u'+pid])return;
  if(S.master&&pid!==S.uid)unsub['l'+pid]=db.collection('pjs/'+pid+'/logs').onSnapshot(s=>{const m={};for(const d of s.docs){const v=d.data();if(v)m[d.id]=Object.assign({id:d.id,pid},v);}S.logs[pid]=m;onRemote();},()=>{});
  unsub['u'+pid]=db.collection('pjs/'+pid+'/fichas').onSnapshot(s=>{const m={};for(const d of s.docs){const v=d.data();if(v)m[d.id]=Object.assign(v,{id:d.id,owner:pid});}
  for(const [id,v] of Object.entries(m)){const loc=S.pcs[pid]&&S.pcs[pid][id];if(loc&&pending.has(id)){m[id]=loc;}if(pid===S.uid&&!logBase[id])logBase[id]=clone(m[id]);}S.pcs[pid]=m;onRemote();},()=>{});}
function allSheets(){const out=[];for(const [pid,m] of Object.entries(S.pcs))for(const [id,v] of Object.entries(m||{}))out.push(Object.assign(v,{id,owner:pid,kind:v.tipo==='npc'?'npc':'pc'}));for(const [id,v] of Object.entries(S.npcs))out.push(Object.assign(v,{id,kind:'npc'}));return out;}
function findSheet(id){return allSheets().find(s=>s.id===id);}
/* whether this viewer can create and save their own sheet (null from the platform = let the save decide) */
function canCreate(){if(S.mode==='local'||S.master)return true;if(!S.uid)return false;return S.canWrite!==false;}
function canEdit(sh){return S.master||(!!sh.owner&&sh.owner===S.uid);}
function queueSave(sh){sh.updatedAt=Date.now();notify();logChange(sh);pending.set(sh.id,sh);setStatus('Alterações não salvas');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
let flushing=false;
async function flush(){if(flushing){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return;}if(!pending.size)return;flushing=true;const items=[...pending.values()];pending.clear();
  if(S.mode==='local'){saveLocal();setStatus('Salvo neste navegador');flushing=false;return;}
  setStatus('Salvando…');let fail=null;
  for(const sh of items){const data=JSON.parse(JSON.stringify(sh));delete data.id;delete data.kind;
    try{if(!sh.owner)await db.doc('npcs/'+sh.id).set(data);else{if(sh.owner===S.uid&&!parentDone){await db.doc('pjs/'+S.uid).set({ativo:Date.now()});parentDone=true;}
      delete data.owner;await db.doc('pjs/'+sh.owner+'/fichas/'+sh.id).set(data);}}catch(e){fail=e;}}
  flushing=false;if(fail){const code=fail&&fail.code;setStatus(code==='invalid_argument'?'Sem permissão para salvar':'Erro ao salvar',true);
    if(code==='invalid_argument'){S.readOnlyMsg='Você pode ler as fichas, mas não salvar. Peça ao mestre para te convidar como Editor no menu Compartilhar.';render();}}else setStatus('Salvo');}
async function removeSheet(sh){if(!sh.owner){delete S.npcs[sh.id];if(db)try{await db.doc('npcs/'+sh.id).delete();}catch(e){}}else{if(S.pcs[sh.owner])delete S.pcs[sh.owner][sh.id];if(db)try{await db.doc('pjs/'+sh.owner+'/fichas/'+sh.id).delete();}catch(e){}}
  pending.delete(sh.id);if(S.mode==='local')saveLocal();}
async function saveCamp(c){S.camps[c.id]=c;if(S.mode==='local'){saveLocal();return;}const d=Object.assign({},c);delete d.id;try{await db.doc('campanhas/'+c.id).set(d);}catch(e){setStatus('Erro ao salvar a campanha',true);}}
async function removeCamp(c){delete S.camps[c.id];if(S.mode==='local'){saveLocal();return;}try{await db.doc('campanhas/'+c.id).delete();await db.doc('segredos/'+c.id).delete();}catch(e){}}
let noteTimer=null;function saveNote(cid,texto){S.notes[cid]={texto,updatedAt:Date.now()};clearTimeout(noteTimer);noteTimer=setTimeout(async()=>{if(S.mode==='local'){saveLocal();return;}try{await db.doc('segredos/'+cid).set(S.notes[cid]);setStatus('Salvo');}catch(e){setStatus('Erro ao salvar notas',true);}},700);}
async function resolveNames(ids){if(!user||!ids.length)return;const need=ids.filter(i=>!(i in S.names));if(!need.length)return;try{const ps=await user.profiles(need);for(const i of need)S.names[i]=(ps[i]&&ps[i].name)||'';}catch(e){}}

/* remote change while a sheet is open: re-render only when the viewer is not typing in it */
let staleSheet=false;
function onRemote(){notify();if(Mesa.view()!=='fichas')return;const r=route();if(r.v==='ficha'){const root=$('#sheetRoot');if(root&&root.contains(R.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(R.activeElement.tagName)){staleSheet=true;return;}}render();}
R.addEventListener('focusout',()=>{setTimeout(()=>{if(staleSheet){const root=$('#sheetRoot');if(!root||!root.contains(R.activeElement)){staleSheet=false;render();}}},50);});

/* ================= DICE ================= */
const trayLog=[];let trayMode='n';
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n);}
let trayTimer=null;
function pushRoll(r){trayLog.unshift(r);trayLog.length=Math.min(trayLog.length,25);const t=$('#tray');t.classList.remove('closed');renderTray(true);clearTimeout(trayTimer);if(window.innerWidth<700)trayTimer=setTimeout(()=>t.classList.add('closed'),4500);}
function rollDnd(label,bonus){const a=rnd(20),b=rnd(20);let pick=a,dice=`d20: ${a}`;if(trayMode==='v'){pick=Math.max(a,b);dice=`2d20 (vantagem): ${a}, ${b}`;}else if(trayMode==='d'){pick=Math.min(a,b);dice=`2d20 (desvantagem): ${a}, ${b}`;}
  pushRoll({label,total:pick+bonus,detail:`${dice} ${bonus>=0?'+':'−'} ${Math.abs(bonus)}`,crit:pick===20,fail:pick===1});}
function rollOp(label,dice,bonus){const n=Math.max(0,dice);const k=n<=0?2:n;const rs=[];for(let i=0;i<k;i++)rs.push(rnd(20));const pick=n<=0?Math.min(...rs):Math.max(...rs);
  pushRoll({label,total:pick+bonus,detail:`${k}d20 [${rs.join(', ')}] → ${n<=0?'menor':'maior'} ${pick} ${bonus>=0?'+':'−'} ${Math.abs(bonus)}`,crit:pick===20,fail:pick===1});}
function rollExpr(label,expr){const s=String(expr||'').replace(/\s/g,'').toLowerCase();if(!/\d/.test(s)){toast('Escreva o dano como 1d8+3.');return;}let total=0;const parts=[];const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m;
  while((m=re.exec(s))){if(m[3]){const sg=m[1]==='-'?-1:1,n=Math.min(50,parseInt(m[2]||'1',10)),f=parseInt(m[3],10);const rs=[];for(let i=0;i<n;i++)rs.push(rnd(f));const sum=rs.reduce((a,b)=>a+b,0)*sg;total+=sum;parts.push(`${sg<0?'−':''}${n}d${f} [${rs.join(', ')}]`);}
    else if(m[5]){const v=parseInt(m[5],10)*(m[4]==='-'?-1:1);total+=v;parts.push(sgn(v));}}
  pushRoll({label,total,detail:parts.join(' ')});}
function renderTray(fresh){const l=$('#trayLog');if(!trayLog.length)return;l.innerHTML=trayLog.map((r,i)=>`<div class="roll${r.crit?' crit':''}${r.fail?' fail':''}${fresh&&i===0?' new':''}"><div class="t"><span>${esc(r.label)}</span><b>${r.total}</b></div><div class="d">${esc(r.detail)}</div></div>`).join('');
  $('#trayLast').textContent=trayLog[0].label+': '+trayLog[0].total;}
$('#trayHead').onclick=()=>{clearTimeout(trayTimer);$('#tray').classList.toggle('closed');};
for(const b of $('#trayMode').children)b.onclick=()=>{trayMode=b.dataset.m;for(const x of $('#trayMode').children)x.setAttribute('aria-pressed',String(x===b));};
for(const f of[4,6,8,10,12,20,100]){const b=document.createElement('button');b.textContent='d'+f;b.onclick=()=>rollExpr('d'+f,'1d'+f);$('#trayDice').appendChild(b);}

function route(){const h=location.hash.slice(1);let m;if((m=h.match(/^entrar-([A-Za-z0-9-]+)$/)))return {v:'oldjoin',id:m[1]};if((m=h.match(/^convite-([A-Za-z0-9-]+)$/)))return {v:'invite',id:m[1]};if((m=h.match(/^campanha-([A-Za-z0-9-]+)$/)))return {v:'camp',id:m[1]};if((m=h.match(/^ficha-([A-Za-z0-9-]+)$/)))return {v:'ficha',id:m[1]};return {v:'home'};}
Mesa.onView((v,changed)=>{if(v!=='fichas')return;if(changed)HOST.scrollTop=0;render();});
const ui={campTab:'grupo',sheetTab:{}};

/* ================= VIEWS ================= */
function crumbs(parts){$('#crumbs').innerHTML=parts.map((p,i)=>(i?'<span aria-hidden="true">›</span>':'')+`<a href="${p[1]}">${esc(p[0])}</a>`).join('');}
function render(){const app=$('#app');const tb=$('.top');if(tb)HOST.style.setProperty('--toph',tb.offsetHeight+'px');$('#who').innerHTML=S.mode==='local'?'<b>Modo local</b>':S.master?'Você é o <b>mestre</b>':'Você é <b>jogador</b>';
  if(!S.ready){app.innerHTML='<p class="lead">Carregando as campanhas…</p>';return;}const r=route();
  if(r.v==='invite')return viewInvite(app,r.id);
  if(r.v==='oldjoin'){crumbs([['Campanhas','#inicio']]);app.innerHTML='<div class="join"><h1 class="view">Convite</h1><div class="empty">Este link de convite é antigo e não vale mais. Cada ficha agora tem o próprio convite: peça um novo ao mestre.</div></div>';return;}
  if(r.v==='camp'&&S.camps[r.id])return viewCamp(app,S.camps[r.id]);if(r.v==='ficha'){const sh=findSheet(r.id);if(sh)return viewSheet(app,sh);app.innerHTML='<div class="empty">Ficha não encontrada. Ela pode ter sido apagada ou ainda estar carregando.</div>';crumbs([['Campanhas','#inicio']]);return;}
  viewHome(app);}
function campCount(cid){return allSheets().filter(s=>s.camp===cid&&s.kind==='pc').length;}
function viewHome(app){crumbs([['Campanhas','#inicio']]);const camps=Object.values(S.camps).filter(c=>S.master||allSheets().some(s=>s.camp===c.id&&s.owner===S.uid)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const banner=S.readOnlyMsg?`<div class="banner">${esc(S.readOnlyMsg)}</div>`:'';
  const intro=S.master?'Crie uma campanha, escolha o sistema e convide os jogadores. Cada um preenche a própria ficha; você vê e edita todas, além de NPCs e notas que só você enxerga.':'Aqui ficam as mesas onde você tem fichas. Para criar uma ficha, use o convite que o mestre te enviar.';
  app.innerHTML=`${banner}<h1 class="view">Campanhas</h1><p class="lead">${intro}</p>
    ${S.master?'<div class="row" style="margin-bottom:14px"><button class="btn primary" id="newCamp">Nova campanha</button></div>':''}
    ${camps.length?`<div class="grid-cards">${camps.map(c=>`<article class="card"><a class="cover" href="#campanha-${c.id}"><span class="badge ${c.sys}">${esc(SYS[c.sys].n)}</span><h3>${esc(c.nome)}</h3></a>
      <div class="meta">${esc(c.desc||'Sem descrição.')}</div><div class="meta">${S.master?campCount(c.id)+' ficha(s) de jogador':'Suas fichas: '+allSheets().filter(s=>s.camp===c.id&&s.owner===S.uid).length}</div><div class="row"><a class="btn small" href="#campanha-${c.id}">Abrir</a></div></article>`).join('')}</div>`
      :`<div class="empty">${S.master?'Nenhuma campanha ainda. Comece em “Nova campanha”.':'Você ainda não tem fichas. Abra o convite que o mestre te enviou.'}</div>`}
    ${S.mode==='cloud'&&S.master?`<h2 style="font-family:var(--f-title);font-weight:400;margin-top:30px">Como convidar os jogadores</h2><ol class="note" style="max-width:65ch;line-height:1.6"><li>No menu Compartilhar desta página, convide cada jogador pelo e-mail como <b>Editor</b>. Quem só tem acesso de leitura consegue ver as fichas, mas não salvar.</li><li>Envie o link da campanha. Cada jogador cria a própria ficha e só consegue editar as fichas dele.</li><li>No Mapa, em “Mesa dos jogadores”, escolha a campanha: os jogadores dela passam a ver o mapa ao vivo no botão <b>Mapa</b>, com a vida dos tokens seguindo as fichas.</li><li>NPCs e notas do mestre ficam guardados num espaço que só você lê.</li></ol>`:''}
    ${S.mode==='local'?'<p class="note" style="margin-top:24px">Modo local: tudo fica salvo só neste navegador. Para jogadores e mestre compartilharem as fichas, abra esta página pelo claude.ai.</p>':''}`;
  const nb=$('#newCamp');if(nb)nb.onclick=()=>campForm();}
function campForm(c){const isNew=!c;c=c||{id:uid(),nome:'',sys:'dnd',desc:'',createdAt:Date.now()};let sys=c.sys;
  openModal(`<h2>${isNew?'Nova campanha':'Editar campanha'}</h2><label class="field"><span>Nome</span><input id="cNome" value="${esc(c.nome)}" placeholder="Ex.: A Maldição de Valdren"></label>
    <div class="field"><span>Sistema</span><div class="choices" id="cSys">${Object.values(SYS).map(s=>`<button type="button" class="choice" data-s="${s.id}" aria-pressed="${s.id===sys}"><b>${esc(s.n)}</b><small>${{dnd:'Pergaminho, atributos, magias por nível.',op:'Dossiê da Ordem, NEX, rituais e sanidade.',etmos:'Grimório de partículas, fadiga e palavras mágicas.'}[s.id]}</small></button>`).join('')}</div>
    ${isNew?'':'<small class="note">Mudar o sistema não converte as fichas que já existem.</small>'}</div>
    <label class="field"><span>Descrição</span><textarea id="cDesc" rows="3">${esc(c.desc)}</textarea></label>
    <div class="row" style="justify-content:flex-end">${isNew?'':'<button class="btn danger" id="cDel">Apagar campanha</button>'}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="cOk">${isNew?'Criar':'Salvar'}</button></div>`);
  for(const b of $('#cSys').children)b.onclick=()=>{sys=b.dataset.s;for(const x of $('#cSys').children)x.setAttribute('aria-pressed',String(x===b));};
  $('#cOk').onclick=async()=>{const nome=$('#cNome').value.trim();if(!nome){$('#cNome').focus();return;}c.nome=nome;c.sys=sys;c.desc=$('#cDesc').value.trim();closeModal();await saveCamp(c);location.hash='campanha-'+c.id;render();};
  const del=$('#cDel');if(del)del.onclick=()=>confirmBox(`Apagar “${c.nome}”? As fichas continuam guardadas, mas a campanha some da lista.`,async()=>{await removeCamp(c);location.hash='inicio';render();});}
function hpOf(sh){if(sh.sys==='etmos'){const l=etLimF(sh);return [l-num(sh.ferimentos),l];}if(sh.sys==='op'){const mx=opMax(sh,'pv');return [num(sh.pv),mx];}return [num(sh.pv),num(sh.pvMax)];}
function setHpVal(sh,v){const [,mx]=hpOf(sh);if(sh.sys==='etmos')sh.ferimentos=clamp(mx-v,0,mx);else sh.pv=clamp(v,-mx,mx);}
function barColor(f){return f>.5?'#3f9a5a':f>.25?'#d4a42c':'#c0392b';}
function subOf(sh){if(sh.sys==='etmos')return `Nível ${sh.nivel||1}${sh.ano?' · '+sh.ano+' ano':''}${sh.idade?' · '+sh.idade+' anos':''}`;if(sh.sys==='op')return `${(OP.classes[sh.classe]||{n:''}).n} · NEX ${sh.nex}%${sh.trilha?' · '+sh.trilha:''}`;return `${sh.classe||'Sem classe'} ${sh.nivel||1}${sh.especie?' · '+sh.especie:''}`;}
function pcCard(sh,camp){const [pv,mx]=hpOf(sh),f=mx>0?clamp(pv/mx,0,1):0;const ini=(sh.nome||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';const owner=sh.kind==='pc'&&S.mode==='cloud'?(sh.owner===S.uid?'você':S.names[sh.owner]||'jogador'):'';
  let stats;if(sh.sys==='etmos'){const ul=(sh.ultimas||[])[0];stats=`<div><b>${num(sh.atr.corpo)}·${num(sh.atr.alma)}·${num(sh.atr.mente)}</b>Corpo·Alma·Mente</div><div><b>${esc(etFad(sh))}</b>Fadiga</div><div><b>${num(sh.estresse)}/${etLimE(sh)}</b>Estresse</div>${ul?`<div style="grid-column:1/-1"><b class="etw-mini">${esc(etWord(ul.seq))}</b>Última palavra</div>`:''}`;}
  else if(sh.sys==='op'){const san=num(sh.san),smx=opMax(sh,'san'),pe=num(sh.pe),pmx=opMax(sh,'pe');stats=`<div><b>${opDef(sh)}</b>Defesa</div><div><b>${pe}/${pmx}</b>PE</div><div><b>${san}/${smx}</b>SAN</div>`;}
  else stats=`<div><b>${num(sh.ca)}</b>CA</div><div><b>${sgn(dIni(sh))}</b>Iniciativa</div><div><b>${10+dSkill(sh,'percepcao')}</b>Perc. passiva</div>`;
  const quick=canEdit(sh)?`<div class="row">${[-5,-1,1,5].map(d=>`<button class="btn small" data-hp="${sh.id}" data-d="${d}" aria-label="${d>0?'Curar':'Dano'} ${Math.abs(d)}">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}<a class="btn small" href="#ficha-${sh.id}" style="margin-left:auto">Abrir ficha</a></div>`:`<div class="row"><a class="btn small" href="#ficha-${sh.id}">Ver ficha</a></div>`;
  return `<article class="card pc"><div class="hd"><span class="av" style="background:${esc(sh.cor||'#555')}">${esc(ini)}</span><div><h3>${esc(sh.nome||'Sem nome')}</h3>${sh.criacao==='rascunho'?'<span class="draft">Em criação</span>':''}<div class="meta">${esc(subOf(sh))}${owner?' · '+esc(owner):''}</div></div></div>
    <div><div class="row" style="justify-content:space-between;font-size:13px"><span>${sh.sys==='op'?'PV':sh.sys==='etmos'?'Ferimentos restantes':'Pontos de vida'}</span><b class="num">${pv} / ${mx}${sh.pvTemp?` (+${sh.pvTemp})`:''}</b></div><div class="bar"><i style="width:${f*100}%;background:${barColor(f)}"></i></div></div>
    <div class="stats">${stats}</div>${(sh.cond||[]).length?`<div class="chips">${sh.cond.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}${quick}</article>`;}
function viewCamp(app,c){lastCamp=c.id;try{sessionStorage.setItem('mesa.camp',c.id);}catch(e){}crumbs([['Campanhas','#inicio'],[c.nome,'#campanha-'+c.id]]);
  const sheets=allSheets().filter(s=>s.camp===c.id&&(S.master||s.owner===S.uid));const pcs=sheets.filter(s=>s.kind==='pc'),npcs=sheets.filter(s=>s.kind==='npc');
  resolveNames([...new Set(sheets.map(s=>s.owner).filter(o=>o&&o!==S.uid))]).then(()=>{if(!S.names.__done&&sheets.some(s=>s.owner&&s.owner!==S.uid)){S.names.__done=1;if(route().v==='camp')render();}});
  const nLog=S.master?campLogs(c.id).filter(l=>(l.fim||0)>seenLogs(c.id)).length:0;
  const tabs=S.master?[['grupo','Grupo'],['npcs','NPCs'],['convites','Convites'],['registro','Registro'+(nLog?` <span class="cnt">${nLog}</span>`:'')],['notas','Notas do mestre']]:[['grupo','Minhas fichas']];if(!tabs.some(t=>t[0]===ui.campTab))ui.campTab='grupo';
  const banner=S.readOnlyMsg?`<div class="banner">${esc(S.readOnlyMsg)}</div>`:'';
  let body='';
  if(ui.campTab==='grupo')body=S.master?`<div class="row" style="margin-bottom:12px"><button class="btn primary" id="newPc">Nova ficha (sua)</button><button class="btn" data-newinv="pc">Convidar um jogador</button></div>
      ${pcs.length?`<div class="grid-cards">${pcs.map(s=>pcCard(s,c)).join('')}</div>`:'<div class="empty">Nenhum personagem ainda. Gere um convite para cada jogador na aba Convites.</div>'}`
    :`${pcs.length?`<div class="grid-cards">${pcs.map(s=>pcCard(s,c)).join('')}</div>`:'<div class="empty">Você ainda não tem fichas nesta mesa.</div>'}<p class="note" style="margin-top:12px">Para criar outra ficha, peça um novo convite ao mestre.</p>`;
  else if(ui.campTab==='npcs')body=`<div class="row" style="margin-bottom:12px"><button class="btn primary" id="newNpc">Novo NPC</button><button class="btn" data-newinv="npc">Convite para criar um NPC</button><span class="note">NPCs que você cria só você vê; os criados por convite também ficam visíveis para quem os criou.</span></div>${npcs.length?`<div class="grid-cards">${npcs.map(s=>pcCard(s,c)).join('')}</div>`:'<div class="empty">Nenhum NPC ainda.</div>'}`;
  else if(ui.campTab==='convites')body=invitesView(c);
  else if(ui.campTab==='registro'){body=logsView(c);setSeenLogs(c.id);}
  else body=`<label class="field"><span>Anotações que só você lê: ganchos, segredos, cronologia da campanha.</span><textarea id="mNotes" rows="16" style="min-height:320px">${esc((S.notes[c.id]||{}).texto||'')}</textarea></label>`;
  app.innerHTML=`${banner}<span class="badge ${c.sys}">${esc(SYS[c.sys].n)}</span><h1 class="view">${esc(c.nome)}</h1>${c.desc?`<p class="lead">${esc(c.desc)}</p>`:''}
    ${S.master?'<div class="row"><button class="btn small" id="editCamp">Editar campanha</button></div>':''}
    ${mesaBox(c)}
    <div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" data-t="${t[0]}" aria-selected="${ui.campTab===t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
  for(const b of app.querySelectorAll('.tabs button'))b.onclick=()=>{ui.campTab=b.dataset.t;render();};
  const om=$('#openMesa');if(om)om.onclick=()=>openCampMap(c);
  const e=$('#editCamp');if(e)e.onclick=()=>campForm(c);
  const np=$('#newPc');if(np)np.onclick=()=>createSheet(c,'pc');const nn=$('#newNpc');if(nn)nn.onclick=()=>createSheet(c,'npc');
  for(const b of app.querySelectorAll('[data-newinv]'))b.onclick=()=>inviteForm(c,b.dataset.newinv);
  bindInvites(app,c);bindLogs(app,c);
  const mn=$('#mNotes');if(mn)mn.oninput=()=>{setStatus('Alterações não salvas');saveNote(c.id,mn.value);};
  for(const b of app.querySelectorAll('[data-hp]'))b.onclick=()=>{const sh=findSheet(b.dataset.hp);if(!sh||!canEdit(sh))return;const [pv,mx]=hpOf(sh);setHpVal(sh,pv+num(b.dataset.d));queueSave(sh);render();};}
/* master: own sheets and private NPCs. Player: only through an invite (inv = {id, tipo}). */
function createSheet(c,kind,nome,inv){if(!S.master&&!inv){toast('Para criar uma ficha, use um convite do mestre.');return null;}if(inv&&!canCreate()){toast('Você ainda não pode criar fichas aqui. Peça ao mestre para te convidar como Editor.');return null;}
  const sh=c.sys==='op'?newOp():c.sys==='etmos'?newEtmos():newDnd();sh.id=uid();sh.camp=c.id;sh.kind=kind;sh.createdAt=Date.now();if(nome)sh.nome=nome;
  if(inv){sh.owner=S.uid;sh.tipo=kind;sh.convite=inv.id;sh.criacao='rascunho';(S.pcs[S.uid]=S.pcs[S.uid]||{})[sh.id]=sh;}
  else if(kind==='npc'){S.npcs[sh.id]=sh;sh.nome=nome||'Novo NPC';}else{sh.owner=S.uid;(S.pcs[S.uid]=S.pcs[S.uid]||{})[sh.id]=sh;}
  logBase[sh.id]=clone(sh);queueSave(sh);location.hash='ficha-'+sh.id;return sh;}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Link copiado.');}catch(e){openModal(`<h2>Copie o link</h2><input class="field" style="padding:8px" value="${esc(t)}" readonly id="cpy"><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Fechar</button></div>`);setTimeout(()=>$('#cpy').select(),30);}}
function openModal(html){$('#modalBox').innerHTML=html;$('#modal').hidden=false;for(const b of $('#modalBox').querySelectorAll('[data-close]'))b.onclick=closeModal;const f=$('#modalBox').querySelector('input,textarea');if(f)setTimeout(()=>f.focus(),30);}
function closeModal(){$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&Mesa.view()==='fichas')closeModal();});
function confirmBox(msg,ok){openModal(`<h2>Tem certeza?</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="cfOk" style="background:var(--bad);border-color:var(--bad)">Apagar</button></div>`);$('#cfOk').onclick=()=>{closeModal();ok();};}

/* ================= INVITES (one link = one sheet) ================= */
const inviteLink=id=>APP_URL+'#convite-'+id;
const tok=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(b=>'abcdefghijkmnopqrstuvwxyz23456789'[b%33]).join('');};
async function newInvite(cid,tipo,para){const id=tok();const v={camp:cid,tipo,para:para||'',criadoEm:Date.now()};
  if(S.mode==='local'){toast('Convites precisam da página aberta pelo claude.ai.');return null;}
  try{await db.doc('convites/'+id).set(v);S.convites[id]=Object.assign({id},v);return id;}catch(e){toast('Não foi possível criar o convite agora.');return null;}}
function inviteForm(c,tipo){openModal(`<h2>${tipo==='npc'?'Convite para criar um NPC':'Convite para um jogador'}</h2>
  <p class="note">O link vale para uma única ficha. ${tipo==='npc'?'Quem usar cria um NPC desta campanha; ele e você veem a ficha.':'O jogador cria um personagem e só enxerga as fichas dele.'}</p>
  <label class="field"><span>Para quem (opcional, só para você se lembrar)</span><input id="invPara" placeholder="Ex.: Ana"></label>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="invOk">Gerar link</button></div>`);
  $('#invOk').onclick=async()=>{const id=await newInvite(c.id,tipo,$('#invPara').value.trim());if(!id)return;
    openModal(`<h2>Link pronto</h2><p class="note">Envie para ${esc(S.convites[id].para||'a pessoa')}. Ele funciona uma vez; para outra ficha, gere outro.</p>
      <div class="invrow"><input readonly value="${esc(inviteLink(id))}" id="invNew" aria-label="Link do convite"><button class="btn primary" id="invNewCopy">Copiar</button></div>
      <p class="note">A pessoa também precisa estar convidada como <b>Editor</b> no menu Compartilhar desta página.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Fechar</button></div>`);
    $('#invNewCopy').onclick=()=>copyText(inviteLink(id));setTimeout(()=>{const i=$('#invNew');if(i)i.select();},40);
    ui.campTab='convites';render();};}
function invitesView(c){const list=Object.values(S.convites).filter(v=>v.camp===c.id).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  const row=v=>{const u=S.usados[v.id];const sh=u&&findSheet(u.ficha);const who=u?(u.uid===S.uid?'você':S.names[u.uid]||'jogador'):'';
    return `<div class="invitem${u?' used':''}"><div class="meta"><b>${v.tipo==='npc'?'NPC':'Jogador'}${v.para?' · para '+esc(v.para):''}</b>
      <small>${u?`Usado por ${esc(who)} em ${new Date(u.em||0).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}${sh?` · ficha “${esc(sh.nome||'sem nome')}”`:''}`:`Aguardando · criado em ${new Date(v.criadoEm||0).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}`}</small></div>
      ${u?(sh?`<a class="btn small" href="#ficha-${sh.id}">Abrir ficha</a>`:''):`<button class="btn small primary" data-invcopy="${v.id}">Copiar link</button><button class="btn small" data-invprev="${v.id}">Ver como jogador</button>`}
      <button class="btn small danger" data-invdel="${v.id}">${u?'Remover':'Cancelar'}</button></div>`;};
  const pend=list.filter(v=>!S.usados[v.id]),used=list.filter(v=>S.usados[v.id]);
  resolveNames([...new Set(used.map(v=>S.usados[v.id].uid).filter(x=>x&&x!==S.uid))]).then(()=>{if(!S.names.__inv&&used.length){S.names.__inv=1;if(ui.campTab==='convites')render();}});
  return `<div class="row" style="margin-bottom:12px"><button class="btn primary" data-newinv="pc">Novo convite de jogador</button><button class="btn" data-newinv="npc">Novo convite de NPC</button></div>
    <p class="note" style="margin:0 0 12px">Cada link cria uma única ficha. Antes de enviar, convide a pessoa como <b>Editor</b> no menu Compartilhar desta página.</p>
    <h3 class="subh">Aguardando (${pend.length})</h3>${pend.length?pend.map(row).join(''):'<div class="empty">Nenhum convite pendente.</div>'}
    ${used.length?`<h3 class="subh">Usados (${used.length})</h3>${used.map(row).join('')}`:''}`;}
function bindInvites(app,c){
  for(const b of app.querySelectorAll('[data-invcopy]'))b.onclick=()=>copyText(inviteLink(b.dataset.invcopy));
  for(const b of app.querySelectorAll('[data-invprev]'))b.onclick=()=>{location.hash='convite-'+b.dataset.invprev;};
  for(const b of app.querySelectorAll('[data-invdel]'))b.onclick=()=>{const id=b.dataset.invdel;const used=!!S.usados[id];
    confirmBox(used?'Remover este convite da lista? A ficha criada continua existindo.':'Cancelar este convite? O link deixa de funcionar.',async()=>{delete S.convites[id];render();try{await db.doc('convites/'+id).delete();}catch(e){toast('Não foi possível cancelar agora.');}});};}
/* the page a player lands on */
const invCache={};
async function loadInvite(id){const st=invCache[id]={state:'loading'};
  try{const [a,b]=await Promise.all([db.doc('convites/'+id).get(),db.doc('usados/'+id).get()]);st.conv=a.exists?a.data():null;st.uso=b.exists?b.data():null;st.state=st.conv?'ok':'missing';}
  catch(e){st.state='error';}
  if(route().v==='invite'&&Mesa.view()==='fichas')render();}
function viewInvite(app,id){crumbs([['Convite','#convite-'+id]]);

/* ================= PLAYER CHANGE LOG ================= */
/* A player's edits after "Concluir criação" go to pjs/<player>/logs, which only the master reads.
   Edits close together form one entry, keeping each field's first old value and latest new value. */
const clone=o=>JSON.parse(JSON.stringify(o));
const logBase={},logSess={};
const LOG_SKIP=new Set(['updatedAt','_mx','id','owner','kind','criacao','criadaEm','convite','tipo','camp','createdAt','ultimas']);
function flatLog(o,pre,out){for(const [k,v] of Object.entries(o||{})){if(!pre&&LOG_SKIP.has(k))continue;const p=pre?pre+'.'+k:k;
    if(Array.isArray(v)&&v.every(x=>x==null||typeof x!=='object'))out[p]=v.join(', ');else if(v&&typeof v==='object')flatLog(v,p,out);else out[p]=v;}return out;}
const fmtV=v=>v===true?'sim':v===false?'não':v==null||v===''?'—':String(v).length>90?String(v).slice(0,88)+'…':String(v);
const LBL={nome:'Nome',jogador:'Jogador',classe:'Classe',subclasse:'Subclasse',nivel:'Nível',especie:'Espécie',antecedente:'Antecedente',alinhamento:'Alinhamento',xp:'XP',cor:'Cor',
  inspiracao:'Inspiração',ca:'CA',iniB:'Bônus de iniciativa',desloc:'Deslocamento',pvMax:'PV máximo',pv:'PV',pvTemp:'PV temporários',dv:'Dados de vida',dvUsados:'Dados de vida usados',conjAtr:'Atributo de conjuração',
  tracos:'Características e talentos',profs:'Proficiências e idiomas',personalidade:'Personalidade',ideais:'Ideais',vinculos:'Vínculos',defeitos:'Defeitos',aparencia:'Aparência',historia:'História',notas:'Notas',cond:'Condições',
  origem:'Origem',trilha:'Trilha',nex:'NEX',patente:'Patente',pp:'Pontos de prestígio',afinidade:'Afinidade',pvAj:'Ajuste de PV',peAj:'Ajuste de PE',sanAj:'Ajuste de SAN',defB:'Bônus de defesa',resist:'Resistências',pe:'PE',san:'SAN',historico:'Histórico',objetivo:'Objetivo',
  ano:'Ano escolar',idade:'Idade',empenho:'Dados de empenho',fadiga:'Fadiga',ferimentos:'Ferimentos',estresse:'Estresse',complex:'Complexidade máxima',origens:'Origens',praticas:'Habilidades práticas',teoricas:'Habilidades teóricas',inventario:'Inventário',basico:'Básico',pontos:'Pontos de importância',futuro:'Futuro',
  morte:'Testes contra a morte',moedas:'Moedas',itens:'Item',ataques:'Ataque',magias:'Magia',rituais:'Ritual',habilidades:'Habilidade',palavras:'Palavra guardada',slots:'Espaços de magia',valores:'Valores',marcos:'Marcos'};
const SUB={s:'sucessos',f:'falhas',fis:'físicos',emo:'emocionais',men:'mentais',a:'lado A',b:'lado B',g:'grau',b2:'bônus',nome:'nome',qtd:'quantidade',peso:'peso',bonus:'bônus',dano:'dano',nivel:'nível',circ:'círculo',custo:'custo',elem:'elemento',esp:'espaços',cat:'categoria',desc:'descrição',nota:'anotação',tot:'total',usados:'usados',per:'perícia',crit:'crítico',alc:'alcance',tipo:'tipo'};
function labelFor(sh,path){const sys=SYS[sh.sys]||DND;const ps=path.split('.');const [a,b,c]=ps;
  if(a==='atr'){const at=(sys.atrs||[]).find(x=>x[0]===b);return at?at[1]:b==='corpo'?'Corpo':b==='alma'?'Alma':b==='mente'?'Mente':path;}
  if(a==='per'){const sk=(sys.skills||[]).find(x=>x[0]===b);const n=sk?sk[1]:b;return sh.sys==='op'?`${n} (${c==='g'?'grau':'outros bônus'})`:`${n} (proficiência)`;}
  if(a==='salv'){const at=DND.atrs.find(x=>x[0]===b);return 'Salvaguarda de '+(at?at[1]:b);}
  if(a==='parts')return 'Partícula '+etSil(b);
  if(a==='moedas')return 'Moedas ('+String(b).toUpperCase()+')';
  if(/^\d+$/.test(b||''))return `${LBL[a]||a} ${num(b)+1}${c?' · '+(SUB[c]||c):''}`;
  return (LBL[a]||a)+(b?' · '+(SUB[b]||b):'');}
function shouldLog(sh){return S.mode==='cloud'&&!S.master&&sh.owner===S.uid&&sh.criacao!=='rascunho';}
function logChange(sh){if(!shouldLog(sh)){logBase[sh.id]=clone(sh);return;}
  const before=logBase[sh.id];logBase[sh.id]=clone(sh);if(!before)return;
  const A=flatLog(before,'',{}),B=flatLog(sh,'',{});const now=Date.now();
  let ss=logSess[sh.id];if(!ss||now-ss.last>3*60000)ss=logSess[sh.id]={id:uid(),inicio:now,last:now,ch:new Map()};ss.last=now;
  for(const k of new Set([...Object.keys(A),...Object.keys(B)])){if(A[k]===B[k])continue;const e=ss.ch.get(k);if(e){e.para=fmtV(B[k]);if(e.para===e.de)ss.ch.delete(k);}else ss.ch.set(k,{k:labelFor(sh,k),de:fmtV(A[k]),para:fmtV(B[k])});}
  const ub=(before.ultimas||[])[0],ua=(sh.ultimas||[])[0];if(ua&&(!ub||ua.t!==ub.t))ss.ch.set('conj:'+ua.t,{k:'Palavra conjurada',de:'',para:etWord(ua.seq)});
  if(!ss.ch.size)return;clearTimeout(ss.timer);ss.timer=setTimeout(()=>writeSess(sh,ss),1500);}
async function writeSess(sh,ss){const list=[...ss.ch.values()];const doc={ficha:sh.id,nome:sh.nome||'',camp:sh.camp,inicio:ss.inicio,fim:ss.last,mudancas:list.slice(0,80),extra:Math.max(0,list.length-80)};
  try{await db.doc('pjs/'+S.uid+'/logs/'+ss.id).set(doc);}catch(e){}}
async function writeLogNow(sh,mudancas,tipo){if(S.mode!=='cloud'||S.master||sh.owner!==S.uid)return;const t=Date.now();
  try{await db.doc('pjs/'+S.uid+'/logs/'+uid()).set({ficha:sh.id,nome:sh.nome||'',camp:sh.camp,inicio:t,fim:t,tipo:tipo||'',mudancas});}catch(e){}}
window.addEventListener('pagehide',()=>{for(const id in logSess){const ss=logSess[id];if(ss.timer){clearTimeout(ss.timer);const sh=findSheet(id);if(sh)writeSess(sh,ss);}}});
function campLogs(cid){const out=[];for(const m of Object.values(S.logs))for(const l of Object.values(m||{}))if(l.camp===cid)out.push(l);return out.sort((a,b)=>(b.fim||0)-(a.fim||0));}
const seenLogs=cid=>num(store.get('mesa.logvisto.'+cid));
const setSeenLogs=cid=>store.set('mesa.logvisto.'+cid,String(Date.now()));
function logsView(c){const all=campLogs(c.id);const f=ui.logF&&ui.logF[c.id]||'';const list=f?all.filter(l=>l.ficha===f):all;const seen=seenLogs(c.id);
  resolveNames([...new Set(all.map(l=>l.pid))]).then(()=>{if(!S.names.__log&&all.length){S.names.__log=1;if(ui.campTab==='registro')render();}});
  const fichas=[...new Map(all.map(l=>[l.ficha,(findSheet(l.ficha)||{}).nome||l.nome])).entries()];
  const t=x=>new Date(x||0).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `<div class="row" style="margin-bottom:12px"><label class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Ficha</span><select id="logF"><option value="">Todas</option>${fichas.map(([id,n])=>`<option value="${esc(id)}" ${f===id?'selected':''}>${esc(n||'sem nome')}</option>`).join('')}</select></label>
    <span class="note">Alterações que os jogadores fizeram nas próprias fichas depois de concluir a criação. Só você vê.</span></div>
    ${list.length?list.map(l=>{const sh=findSheet(l.ficha);return `<article class="logitem${(l.fim||0)>seen?' new':''}"><header><b>${esc((sh&&sh.nome)||l.nome||'Ficha')}</b><span class="note">por ${esc(S.names[l.pid]||'jogador')} · ${t(l.inicio)}${l.fim&&l.fim-l.inicio>60000?' – '+new Date(l.fim).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</span>${sh?`<a class="btn small" href="#ficha-${sh.id}" style="margin-left:auto">Abrir ficha</a>`:''}</header>
      ${l.tipo==='criada'?'<p class="logc">Concluiu a criação da ficha.</p>':`<ul>${(l.mudancas||[]).map(m=>`<li><span class="k">${esc(m.k)}</span>${m.de!==''&&m.de!=null?`<span class="de">${esc(m.de)}</span><span aria-hidden="true">→</span>`:''}<span class="para">${esc(m.para)}</span></li>`).join('')}${l.extra?`<li class="note">e mais ${l.extra} alterações</li>`:''}</ul>`}</article>`;}).join('')
      :'<div class="empty">Nenhuma alteração registrada ainda.</div>'}`;}

function bindSheet(root,sh){
  for(const el of root.querySelectorAll('[data-k]')){const k=el.dataset.k,v=getP(sh,k);if(el.type==='checkbox')el.checked=!!v;else el.value=v==null?'':v;
    el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'||el.dataset.re?'change':'input',()=>{let val=el.type==='checkbox'?el.checked:el.dataset.t==='n'?num(el.value):el.value;const old=getP(sh,k);setP(sh,k,val);if(afterSet(sh,k,val,old)){queueSave(sh);render();return;}
      if(el.dataset.re){queueSave(sh);render();return;}calc(root,sh);queueSave(sh);});}
  for(const b of root.querySelectorAll('.stabs button'))b.onclick=()=>{ui.sheetTab[sh.id]=b.dataset.t;render();};
  for(const b of root.querySelectorAll('[data-cycle]'))b.onclick=()=>{const k=b.dataset.cycle,mx=num(b.dataset.max||2);const v=(num(getP(sh,k))+1)%(mx+1);setP(sh,k,v);b.dataset.v=v;b.setAttribute('aria-label',b.getAttribute('aria-label').replace(/:.*/,': '+['sem proficiência','proficiente','especialista'][v]));calc(root,sh);queueSave(sh);};

  for(const b of root.querySelectorAll('[data-add]'))b.onclick=()=>{const k=b.dataset.add;const arr=getP(sh,k)||[];arr.push(JSON.parse(b.dataset.tpl||'{}'));setP(sh,k,arr);queueSave(sh);render();};
  for(const b of root.querySelectorAll('[data-del]'))b.onclick=()=>{const [k,i]=b.dataset.del.split('|');const arr=getP(sh,k)||[];arr.splice(num(i),1);queueSave(sh);render();};
  for(const b of root.querySelectorAll('[data-step]'))b.onclick=()=>{const k=b.dataset.step,lim=b.dataset.lim?num(getP(sh,b.dataset.lim))||(b.dataset.limf?calcVal(sh,b.dataset.limf):1e9):b.dataset.limf?calcVal(sh,b.dataset.limf):1e9;let v=num(getP(sh,k))+num(b.dataset.d);if(num(b.dataset.d)>0)v=Math.min(v,lim);if(b.dataset.floor!=null)v=Math.max(v,num(b.dataset.floor));setP(sh,k,v);
    const inp=root.querySelector(`[data-k="${k}"]`);if(inp)inp.value=v;calc(root,sh);queueSave(sh);};
  for(const b of root.querySelectorAll('[data-pip]'))b.onclick=()=>{const k=b.dataset.pip,i=num(b.dataset.i);const cur=num(getP(sh,k));setP(sh,k,Math.max(0,cur===i?i-1:i));queueSave(sh);render();};

  for(const el of root.querySelectorAll('[data-roll]'))el.addEventListener('click',e=>{if(e.target.closest('input,select,button:not([data-roll])'))return;doRoll(sh,el.dataset.roll);});

/* rules that react to a field: ritual cost follows its circle, OP current values follow a raised maximum */
function afterSet(sh,k,val,old){let m;if(sh.sys==='op'&&(m=k.match(/^rituais\.(\d+)\.circ$/))){const r=sh.rituais[num(m[1])];if(num(r.custo)===OP.custo[num(old)]||!r.custo)r.custo=OP.custo[num(val)];return true;}
  if(sh.sys==='op'&&/^(classe|nex|atr\.vig|atr\.pre|pvAj|peAj|sanAj)$/.test(k)){sh._mx=sh._mx||{};for(const s of['pv','pe','san']){const mx=opMax(sh,s),om=sh._mx[s];
      if(om!=null&&mx!==om)sh[s]=clamp(num(sh[s])+(mx-om),0,mx);else if(sh[s]==null||num(sh[s])>mx)sh[s]=mx;sh._mx[s]=mx;}return /^(classe|nex)$/.test(k);}
  return false;}
function calcVal(sh,name){const [f,a]=name.split(':');
  if(sh.sys==='etmos'){if(f==='limf')return etLimF(sh);if(f==='lime')return etLimE(sh);return 0;}
  if(sh.sys==='op'){switch(f){case 'max':return opMax(sh,a);case 'per':return opSkill(sh,a);case 'def':return opDef(sh);case 'carga':return opCarga(sh);case 'esp':return opEsp(sh);case 'lim':return opLvl(sh);}return 0;}
  switch(f){case 'mod':return dMod(sh.atr[a]);case 'save':return dSave(sh,a);case 'per':return dSkill(sh,a);case 'prof':return dProf(sh);case 'ini':return dIni(sh);case 'pp':return 10+dSkill(sh,'percepcao');case 'dc':return dDC(sh);case 'atk':return dAtk(sh);case 'peso':return dWeight(sh);case 'cap':return dCap(sh);}return 0;}
function calc(root,sh){for(const el of root.querySelectorAll('[data-c]')){const v=calcVal(sh,el.dataset.c);el.textContent=el.dataset.fmt==='s'?sgn(v):el.dataset.fmt==='kg'?(Math.round(v*10)/10).toLocaleString('pt-BR')+' kg':v;}
  for(const el of root.querySelectorAll('[data-meter]')){const [cur,mx]=el.dataset.meter.split('|');const m=calcVal(sh,mx),f=m>0?clamp(num(getP(sh,cur))/m,0,1):0;el.firstElementChild.style.width=(f*100)+'%';}

function doRoll(sh,spec){const [f,a,b]=spec.split(':');const who=sh.nome||'Ficha';
  if(sh.sys==='op'){if(f==='atr')return rollOp(`${who} · ${OP.atrs.find(x=>x[0]===a)[1]}`,num(sh.atr[a]),0);if(f==='per'){const sk=OP.skills.find(x=>x[0]===a);return rollOp(`${who} · ${sk[1]}`,num(sh.atr[sk[2]]),opSkill(sh,a));}
    if(f==='atk'){const at=sh.ataques[num(a)];const sk=OP.skills.find(x=>x[0]===(at.per||'luta'))||OP.skills[15];return rollOp(`${who} · ${at.nome||'Ataque'}`,num(sh.atr[sk[2]]),opSkill(sh,sk[0])+num(at.bonus));}
    if(f==='dmg'){const at=sh.ataques[num(a)];return rollExpr(`${who} · dano de ${at.nome||'ataque'}`,at.dano);}return;}
  if(f==='atr')return rollDnd(`${who} · ${DND.atrs.find(x=>x[0]===a)[1]}`,dMod(sh.atr[a]));if(f==='save')return rollDnd(`${who} · salvaguarda de ${DND.atrs.find(x=>x[0]===a)[1]}`,dSave(sh,a));

  if(f==='atk'){const at=sh.ataques[num(a)];return rollDnd(`${who} · ${at.nome||'Ataque'}`,num(at.bonus));}if(f==='dmg'){const at=sh.ataques[num(a)];return rollExpr(`${who} · dano de ${at.nome||'ataque'}`,at.dano);}
